[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-vision"
version = "1.0.0"
description = "Soccer detection, tracking, team classification and video analytics"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8,<5",
    "pyyaml>=6,<7",
    "matplotlib>=3.7,<4",
    "ultralytics==8.4.141",
    "torch>=2.2,<3",
    "lap>=0.5.12,<0.6",
    "requests>=2.31,<3",
    "pillow>=10,<13",
]

[project.optional-dependencies]
detection = ["ultralytics>=8.4.141,<9", "torch>=2.2,<3"]
evaluation = ["motmetrics>=1.4,<2", "scipy>=1.10,<2", "pandas>=2,<3"]

[project.scripts]
soccer-vision = "soccer_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
