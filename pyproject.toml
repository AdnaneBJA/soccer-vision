[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-vision"
version = "0.1.0"
description = "Incremental soccer video detection and analytics pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.8,<5"]

[project.scripts]
soccer-vision = "soccer_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
